<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">

  <g transform="translate(350, 0)">

    <!-- PING – vidljivi crni path izvan maske -->
    <path
      d="M 80 185
         L 180 185
         L 210 215
         L 240 155
         L 270 215
         L 300 185
         L 400 185"
      stroke="black"
      stroke-width="4"
      fill="none"
    />

    <!-- MASKA -->
    <mask id="cutout">
      <rect x="0" y="0" width="1100" height="720" fill="white"/>

      <!-- PING – puni crni shape koji reže štit -->
      <path
        d="M 80 185
           L 180 185
           L 210 215
           L 240 155
           L 270 215
           L 300 185
           L 400 185
           L 400 190
           L 80 190
           Z"
        fill="black"
      />

      <!-- VNAGY – crni u maski -->
      <rect x="80" y="240" width="320" height="90" fill="black"/>
      <text
        x="236.3"
        y="309.5"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Winner Sans Wide Extra Bold"
        font-size="133.5"
        fill="black">
        VNAGY
      </text>
    </mask>

    <!-- ŠTIT – maskiran -->
    <path
      d="M 240 115
         L 110 127.5
         Q 120 340 240 388.5
         Q 360 340 370 127.5
         L 240 115 Z"
      fill="none"
      stroke="#000000"
      stroke-width="8.0"
      stroke-linejoin="round"
      mask="url(#cutout)"
    />

    <!-- VNAGY – vidljiv izvan maske -->
    <text
      x="236.3"
      y="309.5"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Winner Sans Wide Extra Bold"
      font-size="133.5"
      fill="#000000"
      stroke="#000000"
      stroke-width="14.0"
      stroke-linejoin="round">
        VNAGY
    </text>

    <!-- Sekundarni tekst -->
    <text
      x="235"
      y="430"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Winner Sans Wide Extra Bold"
      font-size="33.4"
      font-weight="normal"
      fill="#000000">
      OFFLINE-FIRST SECURITY ENGINEERING
    </text>

  </g>

</svg>





























